# ------------------------------
# Reasoning Models
# ------------------------------

claude-sonnet-4-5:
  model_name: "openrouter/anthropic/claude-sonnet-4.5"
  model_type: openrouter
  display_name: "Claude Sonnet 4.5"
  reasoning_effort:
    enabled: false

claude-opus-4-5:
  model_name: "openrouter/anthropic/claude-opus-4.5"
  model_type: openrouter
  display_name: "Claude Opus 4.5"
  reasoning_effort:
    enabled: false

gpt-5-2-reasoning:
  model_name: "gpt-5.2"
  model_type: openai
  display_name: "GPT-5.2 (reasoning)"
  reasoning_effort:
    effort: "low"
    summary: "detailed"
  #text_verbosity:
  #  verbosity: "low" # Options: "low", "medium", "high"

gpt-5-2-non-reasoning:
  model_name: "gpt-5.2"
  model_type: openai
  display_name: "GPT-5.2"
  reasoning_effort:
    effort: "none"

gpt-5-reasoning:
  model_name: "gpt-5"
  model_type: openai
  display_name: "GPT-5 (reasoning)"
  reasoning_effort:
      effort: "low"
      summary: "detailed"
  text_verbosity:
    verbosity: "low" # Options: "low", "medium", "high"

deepseek-v3-2-reasoning:
  model_name: "openrouter/deepseek/deepseek-v3.2"
  model_type: openrouter
  display_name: "DeepSeek V3.2 (reasoning)"
  reasoning_effort:
    enabled: true
    effort: "low"

deepseek-v3-2-non-reasoning:
  model_name: "openrouter/deepseek/deepseek-v3.2"
  model_type: openrouter
  display_name: "DeepSeek V3.2"
  # No reasoning_effort set, so LiteLLMAgent will be used instead of ReasoningAgent
  extra_body:
    text:
      verbosity: "low"  # Options: "low", "medium", "high"

grok-41-fast-non-reasoning:
  model_name: "openrouter/x-ai/grok-4.1-fast"
  model_type: openrouter
  display_name: "Grok 4.1 Fast"
  reasoning_effort:
    enabled: false

grok-41-fast-reasoning:
  model_name: "openrouter/x-ai/grok-4.1-fast"
  model_type: openrouter
  display_name: "Grok 4.1 Fast (reasoning)"
  reasoning_effort:
    enabled: true
    effort: "low"


