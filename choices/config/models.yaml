# --- Qwen3 235B (hybrid model - supports on/off from single checkpoint) ---
# NOTE: Qwen3 via Fireworks/OpenRouter is heavily rate-limited and the Responses API
# ignores effort levels. Kept for reference but not used in reasoning effort experiment.
qwen3-235b-non-reasoning:
  model_name: "openrouter/qwen/qwen3-235b-a22b"
  model_type: openrouter
  display_name: "Qwen 3.2 235B"
  concurrency_limit: 50
  extra_body:
    chat_template_kwargs:
      enable_thinking: false

qwen3-235b-reasoning-low:
  model_name: "openrouter/qwen/qwen3-235b-a22b"
  model_type: openrouter
  display_name: "Qwen 3.2 235B (reasoning low)"
  concurrency_limit: 50
  reasoning_effort:
    enabled: true
    effort: "low"

qwen3-235b-reasoning-medium:
