  model_type: openrouter
  display_name: "Qwen 3.2 235B (reasoning high)"
  concurrency_limit: 50
  reasoning_effort:
    enabled: true
    effort: "high"

# --- GLM 5 (Z.ai / Zhipu - reasoning effort levels work via OpenRouter) ---
