# DailyDilemmas Contextual Influence Experiment
# Same 4 models as the original Choices paper for direct comparison.

models:
  - gpt-5-2-non-reasoning
  - deepseek-v3-2-non-reasoning
  #- grok-41-fast-non-reasoning
  - llama-33-70b

influence_types:
  #- few_shot_action
  - few_shot_value
  - survey
  #- social_norm
  - emotional
  - user_preference
  - virtue
  - role_play
  - weak_evidence

# Responses per dilemma per condition
k_per_dilemma: 3

# Few-shot example count
n_few_shot_examples: 3

# Max concurrent API requests
max_concurrent: 50

seed: 42
