# BBQ Nudging Experiments – Batch Configuration
#
# Run with:
#   uv run python experiments/2026-04-14-bbq/run.py --config experiments/2026-04-14-bbq/batch_config.yaml

categories:
  - age
  #- gender
  #- disability
  # - nationality
  # - appearance
  # - ses

models:
  - llama-33-70b
  # - deepseek-v3-2-non-reasoning
  # - gpt-5-2-non-reasoning

nudges:
  - weak_evidence
  - emotional
  - virtue_appeal
  # - survey_preference
  # - strong_evidence
  # - expert_recommendation
  # - user_preference
  # - social_norm
  # - always
  # - role_play

settings:
  context_condition: ambig     # ambig (default), disambig, or both
  max_questions: 50            # BBQ questions sampled per category
  requests_per_edge: 4         # repeated API calls per comparison
  reasoning: none              # none, before, after
  seed: 42
  max_retries: 10
  save_dir: experiments/2026-04-14-bbq/results
  data_dir: experiments/2026-04-14-bbq/data
